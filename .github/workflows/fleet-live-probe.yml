name: fleet-live-probe

# Synthetic health check of every hosted MCP server listed in the official
# MCP registry. Every 30 minutes: initialize + tools/list (no tool calls).
# Once a day: also calls the free, read-only describe_agent tool.
# Then scripts/fleet_watch.py checks the gateway's /healthz, payment surfaces
# and per-tool outcomes, and alerts only when something changes: to Slack if
# FLEET_ALERT_SLACK_WEBHOOK is set, otherwise a "Fleet alert" issue here.
# A red run means at least one non-ignored problem is active.
on:
  schedule:
    - cron: "7,37 * * * *"
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      call_describe:
        description: "Also call describe_agent on each server"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write   # fleet_watch opens/closes one "Fleet alert" issue when Slack isn't set

concurrency:
  group: fleet-live-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe hosted fleet
        id: probe
        continue-on-error: true   # fleet_watch decides the run's colour
        env:
          CALL_DESCRIBE: ${{ github.event.schedule == '17 6 * * *' || inputs.call_describe == true }}
        run: |
          args="--json fleet_probe.json --summary $GITHUB_STEP_SUMMARY"
          if [ "$CALL_DESCRIBE" = "true" ]; then args="$args --call-describe"; fi
          python3 scripts/fleet_live_probe.py $args
      - name: Restore the last alert state
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: .fleet-watch
          key: fleet-watch-${{ github.run_id }}
          restore-keys: fleet-watch-
      - name: Watch gateway, payments and tools; alert on change
        if: always()
        env:
          # Optional Slack incoming webhook. Unset = alerts go to a GitHub issue.
          FLEET_ALERT_SLACK_WEBHOOK: ${{ secrets.FLEET_ALERT_SLACK_WEBHOOK }}
          GITHUB_TOKEN: ${{ github.token }}
          # Who the alert issue mentions (GitHub emails them).
          FLEET_ALERT_MENTION: ${{ vars.FLEET_ALERT_MENTION || github.repository_owner }}
          # Comma-separated registry names or subjects that never alert. Default:
          # the stale verdigraph-mcp listing until retire-verdigraph-mcp has run.
          FLEET_ALERT_IGNORE: ${{ vars.FLEET_ALERT_IGNORE || 'io.github.jdhart81/verdigraph-mcp' }}
          # "1" once the Stripe webhook signing secret is meant to be live.
          STRIPE_WEBHOOK_EXPECTED: ${{ vars.STRIPE_WEBHOOK_EXPECTED || '0' }}
        run: python3 scripts/fleet_watch.py --probe fleet_probe.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Save the alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .fleet-watch
          key: fleet-watch-${{ github.run_id }}
      - name: Keep the probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-probe-${{ github.run_id }}
          path: fleet_probe.json
          retention-days: 30

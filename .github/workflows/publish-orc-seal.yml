name: Publish orc-seal to PyPI

on:
  push:
    tags: ["orc-seal-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        working-directory: products/orc-seal
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          assert os.environ["GITHUB_REF_NAME"] == "orc-seal-v" + project["version"]
          PY
      - name: Build and validate distributions
        working-directory: products/orc-seal
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v6
        with:
          name: orc-seal-dist
          path: products/orc-seal/dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/orc-seal/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: orc-seal-dist
          path: dist
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

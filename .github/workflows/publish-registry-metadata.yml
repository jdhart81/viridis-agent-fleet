name: Publish registry metadata

# Republishes every MCP Registry entry that scripts/registry_metadata.py
# manages (icon, title, website, clean description, hosted-build version).
# Entries in its HOLD list are skipped. Run by pushing a tag
# registry-meta-v<anything>, e.g. registry-meta-v20261116. Only listings newer
# than the registry's latest are published; the rest are skipped.
on:
  push:
    tags:
      - "registry-meta-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Metadata is current (RM1-RM6)
        run: |
          pip install pillow fonttools >/dev/null
          python3 scripts/registry_metadata.py check

      - name: Each new version sorts above the registry's latest (RM2)
        run: python3 scripts/registry_metadata.py latest-check

      - name: Install MCP publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_linux_amd64.tar.gz" \
            -o /tmp/mcp-publisher.tar.gz
          echo "ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac  /tmp/mcp-publisher.tar.gz" \
            | sha256sum --check --strict
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
          chmod +x /tmp/mcp-publisher

      - name: Authenticate with GitHub OIDC
        run: /tmp/mcp-publisher login github-oidc

      - name: Validate and publish
        run: |
          set -euo pipefail
          files=$(python3 scripts/registry_metadata.py to-publish)
          [ -n "$files" ] || { echo "nothing newer than the registry's latest"; exit 0; }
          for f in $files; do /tmp/mcp-publisher validate "$f"; done
          for f in $files; do echo "publishing $f"; /tmp/mcp-publisher publish "$f"; done

name: ci
on: [push, pull_request]
jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 scripts/public_boundary_guard.py
  tests:
    runs-on: ubuntu-latest
    needs: boundary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - run: python3 run_fleet_tests.py
  standards:
    # ORC v0.1 conformance: Python reference + the browser verifier's JS
    # (run in node) must agree on every vector, and the Cliff Check builder's
    # SC/GL invariants must hold.
    runs-on: ubuntu-latest
    needs: boundary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: pip install pytest "mcp>=1.20,<2"
      - run: python3 -m pytest -q fleet_utils/test_orc.py products/signed-cliff-check/test_build_report.py products/orc-validator/test_validator.py products/orc-seal/tests

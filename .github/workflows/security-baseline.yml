name: Security baseline

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  security-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify immutable workflow dependencies and registry wrapper
        run: |
          python3 -m unittest \
            scripts/test_workflow_actions_pinned.py \
            scripts/test_publish_mcp_registry_idempotent.py \
            scripts/test_a2a_quote_client.py \
            scripts/test_viridis_preflight_buy.py

      - name: Verify Security buyer with the pinned payment SDK (no network payment)
        run: |
          python3 -m venv /tmp/preflight-buyer-tests
          /tmp/preflight-buyer-tests/bin/pip install 'x402[requests,evm]==2.16.0'
          /tmp/preflight-buyer-tests/bin/python -m unittest scripts/test_viridis_preflight_buy.py

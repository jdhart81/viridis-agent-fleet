name: Witness hourly ORC roots
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: orc-roots-witness
  cancel-in-progress: false
jobs:
  witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Select dedicated witness branch
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/orc-witness; then
            git checkout -b orc-witness origin/orc-witness
          else
            git checkout -b orc-witness origin/main
          fi
      - name: Fetch and validate public root
        run: python -m fleet_utils.orc_witness
      - name: Commit only a new witness
        run: |
          if [ ! -d orc-roots ]; then exit 0; fi
          git add -- orc-roots/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Witness hourly ORC root'
          git push origin HEAD:refs/heads/orc-witness

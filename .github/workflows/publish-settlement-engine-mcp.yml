name: Publish Settlement Engine MCP

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-settlement-engine
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert exact publication scope
        run: |
          python3 - <<'CHECK'
          import json
          m = json.load(open('deploy/mcp-publish-github/settlement-engine-agent/server.json'))
          assert m['name'] == 'io.github.jdhart81/settlement-engine'
          assert m['remotes'][0]['url'] == 'https://mcp.viridisconservation.com/settlement-engine/mcp'
          CHECK
      - name: Install pinned MCP publisher
        run: |
          curl --fail --location 'https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_linux_amd64.tar.gz' -o /tmp/mcp-publisher.tar.gz
          echo 'ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac  /tmp/mcp-publisher.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
          chmod +x /tmp/mcp-publisher
      - name: Validate manifest
        run: /tmp/mcp-publisher validate deploy/mcp-publish-github/settlement-engine-agent/server.json
      - name: Authenticate with GitHub OIDC
        run: /tmp/mcp-publisher login github-oidc
      - name: Publish manifest
        run: /tmp/mcp-publisher publish deploy/mcp-publish-github/settlement-engine-agent/server.json

version: 2
updates:
- package-ecosystem: pip
  directories:
  - /
  - /_AGENT_TEMPLATE
  - /agent-arbitration-agent
  - /agent-compute-ledger-agent
  - /agent-covenant-agent
  - /agent-erc8004-bridge-agent
  - /agent-escrow-agent
  - /agent-hive-orchestrator-agent
  - /agent-identity-registry-agent
  - /agent-market-network-agent
  - /agent-metering-agent
  - /agent-notary-agent
  - /agent-offset-clearinghouse-agent
  - /agent-provenance-agent
  - /agent-surety-agent
  - /agent-trust-oracle-agent
  - /agent-verified-relay-agent
  - /ghg-ledger-agent
  - /narrative-engine-agent
  - /products/orc-seal
  - /protogen-agent
  - /quantity-takeoff-agent
  - /regulatory-radar-agent
  - /robustness-engine-agent
  - /security-preflight-agent
  - /smartscale-agent
  - /taxcredit-engine-agent
  schedule:
    interval: monthly
  open-pull-requests-limit: 5
  cooldown:
    default-days: 7
  ignore:
  - dependency-name: '*'
    update-types:
    - version-update:semver-major
  groups:
    security:
      applies-to: security-updates
      patterns:
      - '*'
    minor-and-patch:
      update-types:
      - minor
      - patch
  versioning-strategy: increase-if-necessary
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  cooldown:
    default-days: 7
  groups:
    github-actions:
      patterns:
      - '*'

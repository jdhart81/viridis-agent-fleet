name: "agent-notary-agent"
version: "0.1.0"
description: "Commit-reveal content notarization: sellers commit to a deliverable's hash before handover; reveals verify exactly; late reveals expire. Turns escrow delivery proofs into cryptographic receipts. Digests only — never raw content."
pillar: "rails"
status: "mvp"
owner: "justin@viridisconservation.com"
a2a_role: "notary"
thesis_connection: |
  Hardens the escrow E-invariants: delivery_proof becomes cryptographically
  meaningful (commit-reveal) instead of caller-supplied text. Failed or late
  reveals are machine-checkable evidence for arbitration. Privacy by
  construction (N7): the notary never sees content, only digests.
revenue_model: |
  Per-notarization micro-fee via the fleet metering/x402 rail; volume tier
  for marketplaces that require notarized delivery on every escrowed job.
actions: [commit, reveal, verify, status, list]
invariants: "N1-N8 (see src/core.py); one test per invariant"
deploy_targets:
  - mcp (adapters/mcp_server.py; mounted at /notary/mcp on the gateway)

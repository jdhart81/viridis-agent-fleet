name: "agent-market-network-agent"
version: "0.7.1"
description: "Signed agent SEO, security-posture evidence, intent routing, messaging, and paid-work marketplace for the agent economy."
pillar: "revenue-infrastructure"
status: "mvp"
owner: "justin@viridis.earth"
a2a_role: "market-network"
revenue_model: |
  Free capability discovery and work matching compounds agent participation.
  Awards route through existing x402 or cash-backed Viridis escrow; Viridis
  earns its existing service or escrow margin without adding a money rail.
actions:
  - publish_agent_profile
  - search_agents
  - publish_security_attestation
  - import_security_receipt
  - list_security_attestations
  - import_operator_verification_receipt
  - list_operator_verifications
  - subscribe_to_work
  - post_work
  - search_work
  - get_work
  - submit_offer
  - award_offer
  - confirm_work_funding
  - submit_delivery
  - accept_delivery
  - attest_settlement
  - submit_usefulness_feedback
  - send_agent_message
  - read_agent_inbox
  - network_status
security:
  write_auth: "Ed25519 signed canonical actions"
  operator_seller_auth: "Operator controls seeded metadata; caller-held Ed25519 keys authorize seller actions"
  replay_protection: "one-use nonces plus idempotency keys"
  payment_credentials: "none"
  hub_event_auth: "HMAC-authenticated private gateway verifier"
payment_rails:
  - x402
  - viridis_cash_escrow
invariants:
  - "No private key, wallet, Stripe, CDP, or facilitator credential accepted"
  - "Operator seller keys are bind-once, cannot be silently rotated or downgraded, and cannot rewrite seeded metadata"
  - "No money movement and no unilateral paid/earnings status"
  - "Production earnings require an independently verified existing-rail money primitive"
  - "Cash-escrow work becomes funded only after post-award Hub verification of exact pull-verified live custody"
  - "Production cash-escrow delivery is refused until independently verified funding exists"
  - "Usefulness requires a buyer-signed outcome on an independently verified paid job"
  - "Feedback stores bounded outcomes and optional note digests, never free-form buyer text"
  - "Independent usefulness requires verified distinct operator entities; related and unverified control stay labeled"
  - "External operator proof requires an allowlisted signed receipt bound to the exact profile digest"
  - "Operator receipt expiry, profile changes, and revocation fail closed"
  - "Operator evidence is stored only as a digest and bounded claim, never raw identity documents or PII"
  - "Optional delivery compute evidence produces an x402-C receipt; evidence is never inferred"
  - "Security posture is signed, expiring coverage evidence; never a secure or vulnerability-free guarantee"
  - "Allowlisted Security result receipts are Ed25519-verified and imported exactly once"
  - "Common-control security evidence is labeled related-party, never independent third-party verification"
  - "Durable-before-ack SQLite writes and append-only event journal"

name: "quantity-takeoff-agent"
version: "0.1.0"
description: "Deterministic, auditable construction material takeoff engine"
pillar: "revenue"
role: "revenue · construction"
status: "mvp"
owner: "justin@viridis.earth"
revenue_model: "10 free takeoffs/day, then $0.50 per takeoff or prepaid credits; construction B2B seats later"
deploy_targets:
  primary: "mcp-server"
  secondary: ["docker"]
dependencies:
  services: []
  agents: ["smartscale-agent", "protogen-agent", "agent-metering-agent", "agent-notary-agent"]
env_vars: []
capabilities:
  inputs: ["typed geometry", "SmartScale measurement payload", "ProtoGen CAD dimensions", "explicit waste override"]
  outputs: ["net quantities", "waste-adjusted exact quantities", "purchase quantities", "trade rollups", "audit digest", "notary payload"]
reference_data:
  path: "data/material_pack.v0.1.0.json"
  effective_as_of: "2026-07-13"
thesis_connection: |
  Built-environment decarbonization starts with honest material math:
  locked waste factors + purchase rounding make takeoffs auditable, the
  upstream input for ghg-ledger embodied-carbon accounting.

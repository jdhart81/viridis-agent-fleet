# Copy to a buyer-owned repository only after reviewing the workflow and pins.
# This example is manual. It has no wallet, payment, scheduled run or subscription.
# Before each run, update PREFLIGHT_CURRENT_INPUTS_JSON from the intended release's
# manifest, policy and samples. This workflow checks that supplied snapshot;
# it does not discover repository changes or inspect a deployed runtime.
name: Verify Security Preflight baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out an operator-reviewed Viridis release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: jdhart81/viridis-agent-fleet
          # Replace this placeholder with a reviewed immutable commit containing --ci.
          ref: REPLACE_WITH_REVIEWED_40_CHARACTER_COMMIT
          persist-credentials: false

      - name: Install the offline verifier dependency
        run: |
          python3 -m venv /tmp/preflight-verify
          /tmp/preflight-verify/bin/pip install 'cryptography==46.0.5'

      - name: Prepare private operator-owned evidence
        env:
          INPUTS_JSON: ${{ secrets.PREFLIGHT_CURRENT_INPUTS_JSON }}
          PAID_RESULT_JSON: ${{ secrets.PREFLIGHT_PAID_RESULT_JSON }}
          TRUST_JSON: ${{ secrets.PREFLIGHT_TRUST_JSON }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'viridis-preflight'
          root.mkdir(mode=0o700)
          for env, name in [('INPUTS_JSON', 'inputs.json'),
                            ('PAID_RESULT_JSON', 'paid.json'), ('TRUST_JSON', 'trust.json')]:
              value = os.environ.get(env, '')
              if not value:
                  raise SystemExit('Required operator evidence is missing')
              try:
                  parsed = json.loads(value)
              except ValueError:
                  raise SystemExit('Operator evidence must be valid JSON') from None
              if not isinstance(parsed, dict):
                  raise SystemExit('Operator evidence must be a JSON object')
              with os.fdopen(os.open(root / name, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600), 'w') as output:
                  json.dump(parsed, output)
          PY

      - name: Require an unchanged and locally verified passing assessment
        run: |
          /tmp/preflight-verify/bin/python scripts/viridis_preflight_watch.py \
            --inputs "$RUNNER_TEMP/viridis-preflight/inputs.json" \
            --paid-result "$RUNNER_TEMP/viridis-preflight/paid.json" \
            --trust "$RUNNER_TEMP/viridis-preflight/trust.json" --ci

      - name: Remove private temporary evidence
        if: always()
        run: |
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          shutil.rmtree(Path(os.environ['RUNNER_TEMP']) / 'viridis-preflight', ignore_errors=True)
          PY

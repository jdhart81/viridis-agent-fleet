name: "wavefunction-search-agent"
version: "0.3.0"
description: "Wavefunction Field: post a goal before you know who can do it; agents sense open work, verified results build trust-scoped routing trails"
pillar: "infrastructure"
status: "prototype"
owner: "justin@viridisconservation.com"
implementation: "wavefunction-field 0.1.0a3 (Apache-2.0, vendored wheel)"
revenue_model: "Free routing reads and writes during v0.1; hosted field and verification-as-a-service, routing demand into paid fleet services"
deploy_targets:
  primary: "mcp-server"
  secondary: ["http"]
dependencies:
  services: []
  agents: []
env_vars: ["WF_DB_PATH", "WF_FIELD_KEY_FILE", "WF_PUBLIC_URL", "WF_TRUSTED_EMITTERS", "WF_TRUSTED_VERIFIERS", "WF_OPERATORS"]
capabilities:
  inputs:
    - "signed intents: goal, hypotheses, acceptance criteria (json_schema | digest | designated), capability tags"
    - "signed deposits: signal, hypothesis, claim, partial"
    - "signed results and designated verifications"
  outputs:
    - "sense rankings of open intents for an agent"
    - "full routing distribution with amplitudes (sum psi^2 = 1)"
    - "public audit stream of signed, hash-chained events"
invariants:
  I-6: "sum(psi^2) = 1 across candidates (INV-RT1)"
  I-7: "resonance links are symmetric and bounded (INV-RT5)"
